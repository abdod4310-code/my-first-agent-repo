<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>أعمال عبد الحق</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Reem+Kufi:wght@500;600;700&display=swap">
<style id="css">
/* Layout: specimen sheet. Hairline-ruled sections on a cool neutral ground, two category hues (games vermilion, sites cobalt), and per-project covers drawn as a pixel sprite (games) or a wireframe (sites). */
:root{
  --bg:#EDEFF3;
  --surface:#FFFFFF;
  --surface-2:#E1E5EC;
  --ink:#10131A;
  --ink-2:#4A5262;
  --line:#CBD0DA;
  --grid:rgba(16,19,26,.055);
  --games:#D9401A;
  --games-t:#B8330F;
  --games-soft:rgba(217,64,26,.18);
  --on-games:#FFFFFF;
  --sites:#2540F0;
  --sites-t:#2038D6;
  --sites-soft:rgba(37,64,240,.15);
  --on-sites:#FFFFFF;
  --ok:#17794E;
  --warn:#92600A;
  --bad:#B42626;
  --font-display:'Reem Kufi','Noto Kufi Arabic','Segoe UI',Tahoma,sans-serif;
  --font-body:'IBM Plex Sans Arabic','Segoe UI',Tahoma,system-ui,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1016;--surface:#151A23;--surface-2:#1E2430;--ink:#E8EBF1;--ink-2:#9EA8BA;--line:#2A3241;--grid:rgba(255,255,255,.045);
    --games:#FF845F;--games-t:#FF9A7B;--games-soft:rgba(255,132,95,.22);--on-games:#1B0A04;
    --sites:#8393FF;--sites-t:#9DA9FF;--sites-soft:rgba(131,147,255,.22);--on-sites:#0B0F2E;
    --ok:#4FC58A;--warn:#E3A83A;--bad:#FF7A7A;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1016;--surface:#151A23;--surface-2:#1E2430;--ink:#E8EBF1;--ink-2:#9EA8BA;--line:#2A3241;--grid:rgba(255,255,255,.045);
  --games:#FF845F;--games-t:#FF9A7B;--games-soft:rgba(255,132,95,.22);--on-games:#1B0A04;
  --sites:#8393FF;--sites-t:#9DA9FF;--sites-soft:rgba(131,147,255,.22);--on-sites:#0B0F2E;
  --ok:#4FC58A;--warn:#E3A83A;--bad:#FF7A7A;color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.7;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--font-display);font-weight:700;line-height:1.25;margin:0;text-wrap:balance}
p{margin:0}
ul{margin:0}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.wrap{width:100%;max-width:1180px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;font-size:.78rem;letter-spacing:.04em}
.ltr{direction:ltr;unicode-bidi:isolate;font-family:var(--font-mono);font-size:.92em}
.muted{color:var(--ink-2)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.i{width:18px;height:18px;flex:none}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;justify-content:space-between;gap:8px 16px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:700;font-size:1.1rem}
.mark{display:grid;place-items:center;width:34px;height:34px;background:var(--ink);color:var(--bg);border-radius:6px;font-size:1.2rem;line-height:1}
.nav{display:flex;gap:2px;overflow-x:auto;max-width:100%;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{padding:8px 14px;font-weight:500;color:var(--ink-2);white-space:nowrap;border-bottom:2px solid transparent}
.nav a:hover{color:var(--ink)}
.nav a[aria-current=page]{color:var(--ink);border-bottom-color:var(--ink)}
@media (max-width:560px){.nav{flex-basis:100%}.nav a{padding:6px 12px}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 18px;border-radius:6px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);font-weight:600;cursor:pointer;white-space:nowrap}
.btn-games{background:var(--games);border-color:var(--games);color:var(--on-games)}
.btn-sites{background:var(--sites);border-color:var(--sites);color:var(--on-sites)}
.btn-ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn-ghost:hover{border-color:var(--ink)}
.btn-inv{background:var(--bg);color:var(--ink);border-color:var(--bg)}
.btn-danger{background:transparent;color:var(--bad);border-color:var(--bad)}
.btn-sm{min-height:34px;padding:0 12px;font-size:.9rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn-ic{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:6px;border:1px solid var(--line);background:var(--surface);cursor:pointer;color:var(--ink-2)}
.btn-ic:hover{border-color:var(--ink);color:var(--ink)}
.btn-ic[aria-pressed=true]{color:var(--ink);border-color:var(--ink)}
.btn-ic.on-star{color:var(--warn);border-color:var(--warn)}
.btn-ic.confirm{width:auto;padding:0 10px;color:var(--bad);border-color:var(--bad);font-size:.85rem;font-weight:600}
@media (prefers-reduced-motion:no-preference){
  .btn,.btn-ic,.card{transition:transform .15s,border-color .15s,background .15s}
  .btn:hover{transform:translateY(-1px)}
  .card:hover{transform:translateY(-2px)}
}

/* hero */
.hero{border-bottom:1px solid var(--line);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:32px 32px}
.hero-in{display:grid;gap:32px;padding-block:clamp(32px,6vw,72px);align-items:center}
@media (min-width:860px){.hero-in{grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr)}}
.avail{display:inline-flex;align-items:center;gap:8px;font-size:.88rem;font-weight:500;border:1px solid var(--line);background:var(--surface);padding:2px 12px;border-radius:999px;width:fit-content}
.avail i{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.hero-txt{display:grid;gap:18px;justify-items:start;min-width:0}
.eyebrow{color:var(--ink-2);font-weight:500}
.hero h1{font-size:clamp(2.3rem,7vw,4.6rem);line-height:1.2}
.hl{padding-inline:.12em}
.hl-g{color:var(--games-t);background:linear-gradient(transparent 68%,var(--games-soft) 68%)}
.hl-s{color:var(--sites-t);background:linear-gradient(transparent 68%,var(--sites-soft) 68%)}
.lead{font-size:1.1rem;color:var(--ink-2);max-width:56ch}
.cta{display:flex;flex-wrap:wrap;gap:10px}
.facts{color:var(--ink-2);font-size:.92rem}
.hero-art{position:relative;aspect-ratio:1.15/1;width:100%;max-width:520px;justify-self:center}
.ha{position:absolute;margin:0;border:1px solid var(--line);background:var(--surface);border-radius:6px;overflow:hidden}
.ha-g{inset-block-start:0;inset-inline-start:0;width:62%}
.ha-s{inset-block-end:0;inset-inline-end:0;width:72%}
.ha figcaption{position:absolute;inset-block-end:6px;inset-inline-start:8px;color:var(--ink-2);background:var(--surface);padding:0 6px;border-radius:3px}
.ha svg{display:block;width:100%;height:auto;aspect-ratio:16/10}

/* generated art */
.art .bg{fill:var(--surface-2)}
.art-game{color:var(--games)}
.art-site{color:var(--sites)}
.art .win{fill:var(--surface);stroke:var(--line);stroke-width:1}
.art .bar{fill:var(--line)}
.art .dot{fill:var(--ink-2);opacity:.6}
.art .ln{fill:var(--ink-2);opacity:.35}
.art .cr{fill:var(--surface-2)}

/* sections */
.sec{padding-block:clamp(36px,6vw,72px);border-bottom:1px solid var(--line)}
.sh{display:flex;justify-content:space-between;align-items:end;gap:12px 24px;flex-wrap:wrap;margin-bottom:24px}
.sh h2{font-size:clamp(1.6rem,4vw,2.2rem)}
.lab{color:var(--ink-2);margin-bottom:6px}
.lab-game,.cat-game .lab{color:var(--games-t)}
.lab-site,.cat-site .lab{color:var(--sites-t)}
.more{display:inline-flex;align-items:center;gap:6px;font-weight:600;border-bottom:1px solid var(--line);padding-bottom:2px}
.more:hover{border-bottom-color:var(--ink)}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.cat{background:var(--surface);padding:24px;display:grid;gap:12px;align-content:start;min-width:0}
.cat h2{font-size:1.9rem}
.cat p:not(.lab){color:var(--ink-2)}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-block:6px}
.mc .cover{border:1px solid var(--line);border-radius:4px}

/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:20px}
.card{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden;min-width:0}
.card:hover{border-color:var(--ink)}
.cover{aspect-ratio:16/10;max-width:100%;background:var(--surface-2);overflow:hidden}
.cover img,.cover svg{display:block;width:100%;height:100%;object-fit:cover}
.card-b{display:grid;gap:8px;padding:16px;align-content:start;flex:1}
.meta{display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--ink-2)}
.kind{font-size:.82rem;font-weight:600}
.kind-game{color:var(--games-t)}
.kind-site{color:var(--sites-t)}
.card h3{font-size:1.3rem}
.tagl{color:var(--ink-2);font-size:.95rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-f{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:4px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:500;padding:1px 8px;border:1px solid var(--line);border-radius:4px;background:var(--surface);color:var(--ink-2)}
.pill i{width:7px;height:7px;border-radius:50%;background:currentColor}
.pill-ok{color:var(--ok)}
.pill-warn{color:var(--warn)}
.chip{display:inline-block;padding:0 8px;border:1px solid var(--line);border-radius:4px;font-size:.8rem;color:var(--ink-2);background:var(--surface);line-height:1.7}
.demo,.hid{font-size:.74rem;padding:0 7px;border-radius:4px;border:1px dashed var(--ink-2);color:var(--ink-2)}
.empty{grid-column:1/-1;border:1px dashed var(--line);border-radius:8px;padding:40px 16px;text-align:center;color:var(--ink-2)}

/* timeline + skills */
.tl{display:grid;gap:0;border-top:1px solid var(--line)}
.tl-row{display:grid;grid-template-columns:72px minmax(0,1fr);gap:16px;padding-block:14px;border-bottom:1px solid var(--line);align-items:baseline}
.tl-row .yr{font-size:1rem;color:var(--ink-2)}
.tl-items{display:flex;flex-wrap:wrap;gap:6px 16px}
.tl-items a{display:inline-flex;align-items:center;gap:8px;font-weight:500}
.tl-items a:hover{text-decoration:underline}
.sq{width:10px;height:10px;display:inline-block}
.sq-game{background:var(--games)}
.sq-site{background:var(--sites)}
.skills{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:28px}
.skills h3{font-size:1.1rem;margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}

/* contact */
.contact{background:var(--ink);color:var(--bg);border-radius:8px;padding:clamp(24px,5vw,48px);display:grid;gap:18px}
.contact h2{font-size:clamp(1.6rem,4vw,2.4rem)}
.contact p{opacity:.8}
.clist{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.cmail{display:inline-flex;align-items:center;gap:10px;border:1px solid color-mix(in srgb,var(--bg) 35%,transparent);border-radius:6px;padding:6px 6px 6px 14px}
.cmail .ltr{user-select:all}
.cmail button{border:0;background:var(--bg);color:var(--ink);border-radius:4px;min-height:30px;padding:0 10px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:.85rem}

/* footer */
.foot{padding-block:28px}
.foot-in{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--ink-2);font-size:.9rem}
.foot a{border-bottom:1px solid var(--line)}
.pvbar{background:var(--ink);color:var(--bg)}
.pvbar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:8px;font-size:.9rem}

/* list pages */
.pg{padding-block:clamp(28px,5vw,56px) clamp(40px,6vw,80px)}
.ph{display:grid;gap:6px;margin-bottom:28px}
.ph h1{font-size:clamp(2rem,6vw,3.4rem)}
.ctl{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.ctl .srch{flex:1 1 240px}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.tg{border:1px solid var(--line);background:var(--surface);border-radius:4px;padding:3px 12px;cursor:pointer;font-size:.9rem}
.tg:hover{border-color:var(--ink)}
.tg.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.count{color:var(--ink-2);font-size:.9rem;margin-bottom:16px}

/* project page */
.back{display:inline-flex;align-items:center;gap:6px;color:var(--ink-2);font-weight:500;margin-bottom:20px}
.back:hover{color:var(--ink)}
.pt{display:grid;gap:10px;margin-bottom:28px}
.pt h1{font-size:clamp(2rem,6vw,3.4rem)}
.pd{display:grid;gap:32px;grid-template-columns:minmax(0,1fr)}
@media (min-width:900px){.pd{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);align-items:start}}
.pmain{display:grid;gap:28px;min-width:0}
.pmain .cover{border:1px solid var(--line);border-radius:8px}
.prose{display:grid;gap:1em;max-width:68ch}
.pmain h2,.side-b h2{font-size:1.25rem;margin-bottom:12px}
.feat{list-style:none;padding:0;display:grid;gap:8px}
.feat li{display:flex;gap:10px;align-items:flex-start}
.feat .i{margin-top:5px;color:var(--ok)}
.shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,160px),1fr));gap:10px}
.shot{padding:0;border:1px solid var(--line);background:var(--surface-2);aspect-ratio:16/10;cursor:zoom-in;overflow:hidden;border-radius:6px}
.shot img{display:block;width:100%;height:100%;object-fit:cover}
.sidebox{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:20px;display:grid;gap:18px;min-width:0}
.dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px 18px;margin:0}
.dl dt{color:var(--ink-2);font-size:.9rem}
.dl dd{margin:0;font-weight:500}
.links{display:grid;gap:8px}
.pn{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:40px}
.pn a{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:14px 16px;display:grid;gap:2px;min-width:0}
.pn a:hover{border-color:var(--ink)}
.pn small{color:var(--ink-2)}
.pn b{font-family:var(--font-display);font-size:1.1rem}
.pn .nx{text-align:end}
.lb{position:fixed;inset:0;z-index:70;background:rgba(8,10,14,.92);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.lb img{max-width:100%;max-height:calc(100vh - 120px);object-fit:contain;border-radius:4px}
.lb-x{position:absolute;inset-block-start:max(12px,env(safe-area-inset-top,0px));inset-inline-end:max(12px,env(safe-area-inset-right,0px))}
.lb-nav{position:absolute;inset-inline:0;inset-block-end:max(14px,env(safe-area-inset-bottom,0px));display:flex;justify-content:center;gap:12px;align-items:center;color:#fff}
.lb .btn-ic{background:#fff;color:#10131A;border-color:#fff}

/* about */
.about-g{display:grid;gap:32px}
@media (min-width:900px){.about-g{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)}}

/* admin */
.adm-in{display:grid;gap:24px;padding-block:24px 120px}
@media (min-width:900px){.adm-in{grid-template-columns:200px minmax(0,1fr);align-items:start}}
.side{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.side::-webkit-scrollbar{display:none}
@media (min-width:900px){.side{flex-direction:column;position:sticky;top:calc(72px + env(safe-area-inset-top,0px))}}
.tab{display:flex;align-items:center;gap:10px;padding:10px 14px;border:1px solid transparent;border-radius:6px;background:transparent;cursor:pointer;font-weight:500;color:var(--ink-2);white-space:nowrap;text-align:start}
.tab:hover{color:var(--ink)}
.tab[aria-current=page]{background:var(--surface);border-color:var(--line);color:var(--ink)}
.am-main{display:grid;gap:20px;min-width:0;align-content:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:20px;display:grid;gap:14px;min-width:0}
.panel h2{font-size:1.2rem}
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.strip>div{background:var(--surface);padding:14px 16px;display:grid;gap:2px}
.strip b{font-family:var(--font-display);font-size:1.9rem;line-height:1.1;font-variant-numeric:tabular-nums}
.strip span{color:var(--ink-2);font-size:.88rem}
.two{display:grid;gap:20px;grid-template-columns:minmax(0,1fr)}
@media (min-width:1000px){.two{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}}
.chart{direction:ltr;width:100%;height:auto;display:block}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--ink-2);font-size:11px;font-family:var(--font-mono)}
.chart .val{fill:var(--ink)}
.chart .bg-g{fill:var(--games)}
.chart .bg-s{fill:var(--sites)}
.legend{display:flex;gap:16px;flex-wrap:wrap;color:var(--ink-2);font-size:.88rem}
.legend span{display:inline-flex;align-items:center;gap:6px}
.seg-bar{display:flex;height:12px;border-radius:3px;overflow:hidden;background:var(--surface-2);gap:2px}
.seg-bar i{display:block;height:100%}
.sb-ok{background:var(--ok)}.sb-warn{background:var(--warn)}.sb-mute{background:var(--ink-2)}
.rb{display:grid;grid-template-columns:90px minmax(0,1fr) 24px;gap:10px;align-items:center;font-size:.9rem}
.rbar{height:8px;background:var(--surface-2);border-radius:2px;overflow:hidden}
.rbar i{display:block;height:100%;background:var(--ink)}
.checks{list-style:none;padding:0;display:grid;gap:0}
.checks li{display:flex;align-items:center;gap:12px;padding-block:10px;border-bottom:1px solid var(--line)}
.checks li:last-child{border-bottom:0}
.ck{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--ink-2);display:grid;place-items:center;flex:none;color:var(--ink-2)}
.ck.ok{background:var(--ok);border-color:var(--ok);color:var(--bg)}
.ck .i{width:14px;height:14px}
.checks .grow{flex:1;min-width:0}
.tb{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tb .srch{flex:1 1 200px}
.alist{list-style:none;padding:0;display:grid;gap:0;border:1px solid var(--line);border-radius:8px;background:var(--surface);overflow:hidden}
.arow{display:grid;grid-template-columns:72px minmax(0,1fr);gap:10px 14px;padding:12px;border-bottom:1px solid var(--line);align-items:center}
.arow:last-child{border-bottom:0}
.arow .thumb{border:1px solid var(--line);border-radius:4px;overflow:hidden}
.ainfo{min-width:0;display:grid;gap:4px}
.at{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.at strong{font-weight:600}

.fld>label,.lg{font-weight:600;font-size:.92rem}
.hint{color:var(--ink-2);font-size:.84rem}
.err{color:var(--bad);font-size:.86rem;min-height:0}

.inp[aria-invalid=true]{border-color:var(--bad)}
fieldset{border:0;padding:0;margin:0;min-width:0}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg label{position:relative;flex:1 1 140px;cursor:pointer}
.seg input{position:absolute;opacity:0;inset:0;cursor:pointer}
.seg span{display:flex;align-items:center;justify-content:center;gap:8px;min-height:44px;border:1px solid var(--line);border-radius:6px;background:var(--bg);font-weight:600}
.seg input:checked+span{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg input:focus-visible+span{outline:2px solid var(--ink);outline-offset:2px}
.sw{display:flex;align-items:center;gap:10px;cursor:pointer}
.sw input{width:20px;height:20px;accent-color:var(--ink)}
.lrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr) auto;gap:8px;align-items:start}
@media (max-width:560px){.lrow{grid-template-columns:minmax(0,1fr) auto}.lrow .inp:nth-child(2){grid-column:1/-1;order:3}}
.up{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start}
.up .thumb-l{width:160px;max-width:100%;border:1px solid var(--line);border-radius:6px;overflow:hidden;position:relative}
.up .thumb-l button{position:absolute;inset-block-start:6px;inset-inline-end:6px}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:0}
.acts{display:flex;gap:10px;flex-wrap:wrap}
.pubbar{position:fixed;inset-inline:0;bottom:0;z-index:35;background:var(--surface);border-top:1px solid var(--line);padding-block:10px calc(10px + env(safe-area-inset-bottom,0px))}
.pubbar .wrap{display:flex;align-items:center;justify-content:space-between;gap:10px 16px;flex-wrap:wrap}
.pubst{display:flex;align-items:center;gap:8px;font-weight:500}
.pubst i{width:9px;height:9px;border-radius:50%;background:var(--ok)}
.pubst.dirty i{background:var(--warn)}
#toast{position:fixed;inset-inline:0;bottom:calc(84px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;pointer-events:none;z-index:80;padding-inline:16px}
#toast span{background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:6px;font-weight:500;max-width:520px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
#toast span.bad{background:var(--bad);color:#fff}
.lock{display:grid;gap:16px;justify-items:start;padding-block:clamp(48px,10vw,120px);max-width:620px}
.lock h1{font-size:clamp(1.8rem,5vw,2.6rem)}

  clearTimeout(toastT);
  toastT=setTimeout(function(){toastEl.innerHTML=''},4200);
}

/* ---------- public pages ---------- */
function curSection(){
  if(token==='games'||token==='websites'||token==='about'||token==='home')return token;
  if(token.indexOf('p-')===0){
    var p=data().projects.find(function(x){return x.id===token.slice(2)});
    if(p)return TYPES[p.type].token;
  }
  return '';
}
function header(){
  var d=data(),cur=curSection();
  var items=[['home','الرئيسية'],['games','الألعاب'],['websites','المواقع'],['about','عني']];
  return '<header class="top"><div class="wrap top-in"><a class="brand" href="#home" data-nav="home"><span class="mark" aria-hidden="true">'+esc(initial(d.profile.name))+'</span><span>'+esc(d.profile.name)+'</span></a><nav class="nav" aria-label="التنقل الرئيسي">'+
    items.map(function(i){return '<a href="#'+i[0]+'" data-nav="'+i[0]+'"'+(cur===i[0]?' aria-current="page"':'')+'>'+i[1]+'</a>'}).join('')+'</nav></div></header>';
}
function footer(){
  var d=data(),u=d.updated?d.updated.slice(0,10):'';
  return '<footer class="foot"><div class="wrap foot-in"><span>© '+new Date().getFullYear()+' '+esc(d.profile.name)+(u?' · آخر تحديث <span class="ltr">'+esc(u)+'</span>':'')+'</span><a href="#admin" data-nav="admin">لوحة التحكم</a></div></footer>';
}
function previewBar(){
  if(!preview)return '';
  return '<div class="pvbar"><div class="wrap"><span>وضع المعاينة: تظهر هنا التعديلات غير المنشورة.</span><button class="btn btn-inv btn-sm" data-act="exitpreview">العودة إلى لوحة التحكم</button></div></div>';
}
function shell(inner){return previewBar()+header()+'<main id="main-c" tabindex="-1">'+inner+'</main>'+footer()}

function card(p){
  var T=TYPES[p.type];
  return '<a class="card" href="#p-'+p.id+'" data-nav="p-'+p.id+'"><div class="cover">'+coverHtml(p)+'</div><div class="card-b"><div class="meta"><span class="kind kind-'+p.type+'">'+T.label+(p.kind?' · '+esc(p.kind):'')+'</span><span class="mono">'+(p.year||'')+'</span></div><h3>'+esc(p.title)+'</h3><p class="tagl">'+esc(p.tagline)+'</p><div class="card-f">'+pill(p.status)+(p.demo?'<span class="demo">تجريبي</span>':'')+p.stack.slice(0,2).map(function(s){return '<span class="chip">'+esc(s)+'</span>'}).join('')+'</div></div></a>';
}
function catPanel(type,list){
  var T=TYPES[type];
  var desc=type==='game'?'ألعاب أصنعها من الصفر: فكرة وتصميم وبرمجة وتجربة لعب.':'مواقع وتطبيقات ويب بواجهات واضحة وتجربة استخدام مرتبة.';
  return '<article class="cat cat-'+type+'"><p class="mono lab">'+T.en+'</p><h2>'+T.plural+'</h2><p>'+desc+'</p><div class="mini">'+
    list.slice(0,3).map(function(p){return '<a class="mc" href="#p-'+p.id+'" data-nav="p-'+p.id+'" title="'+esc(p.title)+'"><div class="cover">'+coverHtml(p)+'</div></a>'}).join('')+
    '</div><a class="more" href="#'+T.token+'" data-nav="'+T.token+'">استعرض '+T.plural+' ('+list.length+') '+icon('arrowL')+'</a></article>';
}
function skillsHtml(P){
  if(!P.skills.length)return '';
  return '<div class="skills">'+P.skills.map(function(g){return '<div><h3>'+esc(g.group)+'</h3><div class="chips">'+g.items.map(function(i){return '<span class="chip">'+esc(i)+'</span>'}).join('')+'</div></div>'}).join('')+'</div>';
}
function timelineHtml(all){
  var m={};all.forEach(function(p){if(p.year){(m[p.year]=m[p.year]||[]).push(p)}});
  var ys=Object.keys(m).map(Number).sort(function(a,b){return b-a});
  if(!ys.length)return '';
  return '<div class="tl">'+ys.map(function(y){return '<div class="tl-row"><span class="mono yr">'+y+'</span><div class="tl-items">'+m[y].map(function(p){return '<a href="#p-'+p.id+'" data-nav="p-'+p.id+'"><span class="sq sq-'+p.type+'"></span>'+esc(p.title)+'</a>'}).join('')+'</div></div>'}).join('')+'</div>';
}
function extLink(l,cls){return '<a class="'+cls+'" href="'+esc(l.url)+'" target="_blank" rel="noopener noreferrer">'+esc(l.label||'رابط')+' '+icon('ext')+'</a>'}
function contactHtml(P){
  if(!P.email&&!P.links.length)return '';
  return '<section class="sec" id="contact"><div class="wrap"><div class="contact"><h2>عندك فكرة للعبة أو موقع؟</h2><p>راسلني وخلنا نتكلم عن التفاصيل.</p><div class="clist">'+
    (P.email?'<span class="cmail"><span class="ltr">'+esc(P.email)+'</span><button type="button" data-act="copy" data-v="'+esc(P.email)+'">'+icon('copy')+'نسخ</button></span>':'')+
    P.links.map(function(l){return extLink(l,'btn btn-inv')}).join('')+'</div></div></div></section>';

function tagList(list){
  var m={};
  list.forEach(function(p){if(p.kind)m[p.kind]=(m[p.kind]||0)+1;p.stack.forEach(function(s){m[s]=(m[s]||0)+1})});
  return Object.keys(m).sort(function(a,b){return m[b]-m[a]||a.localeCompare(b)}).slice(0,10);
}
function filtered(type){
  var f=filters[type],q=f.q.trim().toLowerCase();
  var L=vis(data(),type).filter(function(p){
    var okT=!f.tag||p.kind===f.tag||p.stack.indexOf(f.tag)>-1;
    var okQ=!q||(p.title+' '+p.tagline+' '+p.kind+' '+p.stack.join(' ')).toLowerCase().indexOf(q)>-1;
    return okT&&okQ;
  });
  if(f.sort==='old')L.sort(function(a,b){return(a.year||0)-(b.year||0)});
  else if(f.sort==='name')L.sort(function(a,b){return String(a.title).localeCompare(String(b.title),'ar')});
  return L;
}
function gridHtml(type){
  var L=filtered(type),total=vis(data(),type).length;
  if(!L.length)return '<div class="empty">'+(total?'لا توجد نتائج مطابقة. جرّب كلمة أخرى أو اختر «الكل».':'لم تُضف مشاريع في هذا القسم بعد.')+'</div>';
  return L.map(card).join('');
}
function updateGrid(type){
  var g=$('#grid'),c=$('#cnt');
  if(g)g.innerHTML=gridHtml(type);
  if(c)c.textContent=plural(filtered(type).length,type==='game'?GP:SP);
}
function pageList(type){
  var T=TYPES[type],list=vis(data(),type),f=filters[type],tags=tagList(list);

  return '<section class="wrap pg"><header class="ph"><p class="mono lab lab-'+type+'">'+T.en+'</p><h1>'+T.plural+'</h1><p class="lead">'+lead+'</p></header>'+
    '<div class="ctl"><div class="fld srch"><label class="sr" for="q-'+type+'">بحث</label><input class="inp" id="q-'+type+'" type="search" placeholder="ابحث بالاسم أو التقنية" value="'+esc(f.q)+'" data-lq="'+type+'"></div>'+
    '<div class="fld"><label class="sr" for="s-'+type+'">الترتيب</label><select class="inp" id="s-'+type+'" data-ls="'+type+'"><option value="new"'+(f.sort==='new'?' selected':'')+'>الأحدث أولًا</option><option value="old"'+(f.sort==='old'?' selected':'')+'>الأقدم أولًا</option><option value="name"'+(f.sort==='name'?' selected':'')+'>حسب الاسم</option></select></div></div>'+
    (tags.length?'<div class="tags" role="group" aria-label="تصفية"><button class="tg'+(f.tag===''?' on':'')+'" data-act="tag" data-t="'+type+'" data-v="">الكل</button>'+tags.map(function(t){return '<button class="tg'+(f.tag===t?' on':'')+'" data-act="tag" data-t="'+type+'" data-v="'+esc(t)+'">'+esc(t)+'</button>'}).join('')+'</div>':'')+
    '<p class="count" id="cnt" aria-live="polite">'+plural(filtered(type).length,type==='game'?GP:SP)+'</p><div class="grid" id="grid">'+gridHtml(type)+'</div></section>';
}

function notFound(){return '<section class="wrap lock"><h1>المشروع غير موجود</h1><p class="muted">ربما حُذف أو أُخفي. ارجع إلى المعرض وتصفّح بقية الأعمال.</p><a class="btn" href="#home" data-nav="home">الرئيسية</a></section>'}
function pageProject(id){
  var d=data(),p=d.projects.find(function(x){return x.id===id});
  if(!p||(p.visible===false&&!preview))return notFound();
  var T=TYPES[p.type],sibs=vis(d,p.type),i=sibs.findIndex(function(x){return x.id===p.id});
  var prev=i>0?sibs[i-1]:null,next=(i>-1&&i<sibs.length-1)?sibs[i+1]:null;
  var rows=[['الحالة',STATUS[p.status]],['السنة',p.year||''],[p.type==='game'?'نوع اللعبة':'نوع الموقع',p.kind],['دوري',p.role],['المدة',p.duration],[p.type==='game'?'المنصات':'الاستضافة',p.platform]].filter(function(r){return r[1]});
  var paras=String(p.description||'').split(/\n\s*\n/).filter(Boolean);
  return '<section class="wrap pg"><a class="back" href="#'+T.token+'" data-nav="'+T.token+'">'+icon('arrowR')+T.plural+'</a>'+
    '<header class="pt"><p class="kind kind-'+p.type+'">'+T.label+(p.kind?' · '+esc(p.kind):'')+(p.demo?' · <span class="demo">مشروع تجريبي</span>':'')+(p.visible===false?' · <span class="hid">مخفي</span>':'')+'</p><h1>'+esc(p.title)+'</h1><p class="lead">'+esc(p.tagline)+'</p></header>'+
    '<div class="pd"><div class="pmain"><div class="cover">'+coverHtml(p)+'</div>'+
    (paras.length?'<div><h2>عن المشروع</h2><div class="prose">'+paras.map(function(x){return '<p>'+esc(x)+'</p>'}).join('')+'</div></div>':'')+
    (p.features.length?'<div><h2>أهم المزايا</h2><ul class="feat">'+p.features.map(function(f){return '<li>'+icon('check')+'<span>'+esc(f)+'</span></li>'}).join('')+'</ul></div>':'')+
    (p.shots.length?'<div><h2>لقطات</h2><div class="shots">'+p.shots.map(function(s,k){return '<button class="shot" data-act="lb" data-i="'+k+'" aria-label="عرض اللقطة '+(k+1)+'"><img src="'+s+'" alt="" loading="lazy"></button>'}).join('')+'</div></div>':'')+
    '</div><aside class="sidebox side-b"><dl class="dl">'+rows.map(function(r){return '<dt>'+r[0]+'</dt><dd>'+esc(r[1])+'</dd>'}).join('')+'</dl>'+
    (p.stack.length?'<div><h2>التقنيات</h2><div class="chips">'+p.stack.map(function(s){return '<span class="chip">'+esc(s)+'</span>'}).join('')+'</div></div>':'')+
    (p.links.length?'<div class="links">'+p.links.map(function(l,k){return extLink(l,'btn '+(k===0?(p.type==='game'?'btn-games':'btn-sites'):'btn-ghost'))}).join('')+'</div>':'<p class="muted">لا توجد روابط لهذا المشروع بعد.</p>')+
    '</aside></div>'+
    ((prev||next)?'<nav class="pn" aria-label="مشاريع أخرى"><div>'+(prev?'<a href="#p-'+prev.id+'" data-nav="p-'+prev.id+'"><small>السابق</small><b>'+esc(prev.title)+'</b></a>':'')+'</div><div>'+(next?'<a class="nx" href="#p-'+next.id+'" data-nav="p-'+next.id+'"><small>التالي</small><b>'+esc(next.title)+'</b></a>':'')+'</div></nav>':'')+
    '</section>';
}

/* ---------- admin ---------- */
function stats(d){
  var P=d.projects;
  return{total:P.length,games:P.filter(function(p){return p.type==='game'}).length,sites:P.filter(function(p){return p.type==='site'}).length,
    shown:P.filter(function(p){return p.visible!==false}).length,feat:P.filter(function(p){return p.featured}).length,
    demo:P.filter(function(p){return p.demo}).length,noCover:P.filter(function(p){return!p.cover}).length};
}
function yearChart(d){
  var yrs={};
  d.projects.forEach(function(p){if(!p.year)return;(yrs[p.year]=yrs[p.year]||{game:0,site:0})[p.type]++});
  var keys=Object.keys(yrs).map(Number).sort(function(a,b){return a-b});
  if(!keys.length)return '<p class="muted">أضف سنة للمشاريع لتظهر هذه الإحصائية.</p>';
  if(keys.length>1&&keys[keys.length-1]-keys[0]<=10){var all=[];for(var y0=keys[0];y0<=keys[keys.length-1];y0++)all.push(y0);keys=all}
  var W0=560,H=220,L=30,R=8,T=18,B=26,pw=W0-L-R,ph=H-T-B;
  var max=1;keys.forEach(function(y){var o=yrs[y]||{game:0,site:0};max=Math.max(max,o.game+o.site)});
  var step=max>6?2:1,top=Math.ceil(max/step)*step,slot=pw/keys.length,bw=Math.min(46,slot*0.6),g='',v;
  for(v=0;v<=top;v+=step){var yy=T+ph-ph*v/top;g+='<line x1="'+L+'" x2="'+(W0-R)+'" y1="'+yy+'" y2="'+yy+'" class="gl"/><text x="'+(L-6)+'" y="'+(yy+3.5)+'" text-anchor="end" class="ax">'+v+'</text>'}
  keys.forEach(function(yr,i){
    var o=yrs[yr]||{game:0,site:0},cx=L+slot*i+slot/2,hg=ph*o.game/top,hs=ph*o.site/top,yg=T+ph-hg,ys=yg-hs;
    if(o.game)g+='<rect x="'+(cx-bw/2)+'" y="'+yg+'" width="'+bw+'" height="'+hg+'" class="bg-g"/>';
    if(o.site)g+='<rect x="'+(cx-bw/2)+'" y="'+ys+'" width="'+bw+'" height="'+hs+'" class="bg-s"/>';
    if(o.game+o.site)g+='<text x="'+cx+'" y="'+(ys-5)+'" text-anchor="middle" class="ax val">'+(o.game+o.site)+'</text>';
    g+='<text x="'+cx+'" y="'+(H-8)+'" text-anchor="middle" class="ax">'+yr+'</text>';
  });
  return '<svg class="chart" viewBox="0 0 '+W0+' '+H+'" role="img" aria-label="عدد المشاريع حسب السنة">'+g+'</svg>';
}
function techRank(d){
  var m={};d.projects.forEach(function(p){p.stack.forEach(function(s){m[s]=(m[s]||0)+1})});
  return Object.keys(m).map(function(k){return[k,m[k]]}).sort(function(a,b){return b[1]-a[1]||a[0].localeCompare(b[0])}).slice(0,6);
}
function sizeInfo(){
  ensureDraft();
  var n=JSON.stringify(draft).length;
  return{n:n,mb:(n/1048576).toFixed(1)};
}
function overviewHtml(){
  var d=draft,st=stats(d),P=d.profile,sz=sizeInfo();
  var counts={live:0,wip:0,proto:0,paused:0};d.projects.forEach(function(p){counts[p.status]++});
  var tech=techRank(d),tmax=tech.length?tech[0][1]:1;
  var checks=[
    [P.name.trim().length>0&&P.bio.trim().length>30,'الاسم والنبذة التعريفية مكتوبة','profile'],
    [!!(P.email||P.links.length),'وسيلة تواصل واحدة على الأقل','profile'],
    [st.total>0&&st.noCover===0,'كل مشروع له صورة غلاف ('+(st.total-st.noCover)+' من '+st.total+')','projects'],
    [st.demo===0,'لا توجد مشاريع تجريبية ('+st.demo+' متبقية)','projects'],
    [sz.n<12e6,'حجم الصفحة '+sz.mb+' MB من 16 MB','backup']
  ];
  return '<div class="strip"><div><b>'+st.total+'</b><span>إجمالي المشاريع</span></div><div><b>'+st.games+'</b><span>ألعاب</span></div><div><b>'+st.sites+'</b><span>مواقع</span></div><div><b>'+st.shown+'</b><span>ظاهرة للزوار</span></div><div><b>'+st.feat+'</b><span>مميزة</span></div></div>'+
    '<div class="two"><section class="panel"><h2>المشاريع حسب السنة</h2>'+yearChart(d)+'<div class="legend"><span><i class="sq sq-game"></i>ألعاب</span><span><i class="sq sq-site"></i>مواقع</span></div></section>'+
    '<section class="panel"><h2>الحالة</h2><div class="seg-bar" role="img" aria-label="توزيع الحالات">'+['live','wip','proto','paused'].map(function(k){return counts[k]?'<i class="sb-'+TONE[k]+'" style="width:'+(counts[k]/Math.max(1,st.total)*100)+'%"></i>':''}).join('')+'</div><div class="legend">'+
    ['live','wip','proto','paused'].map(function(k){return '<span>'+STATUS[k]+' <b class="mono">'+counts[k]+'</b></span>'}).join('')+'</div>'+
    '<h2 style="margin-top:8px">أكثر التقنيات استخدامًا</h2>'+(tech.length?tech.map(function(t){return '<div class="rb"><span class="ltr">'+esc(t[0])+'</span><div class="rbar"><i style="width:'+(t[1]/tmax*100)+'%"></i></div><b class="mono">'+t[1]+'</b></div>'}).join(''):'<p class="muted">أضف تقنيات للمشاريع لتظهر هنا.</p>')+'</section></div>'+
    '<section class="panel"><h2>جاهزية المعرض</h2><ul class="checks">'+checks.map(function(c){return '<li><span class="ck'+(c[0]?' ok':'')+'">'+(c[0]?icon('check'):'')+'</span><span class="grow">'+esc(c[1])+'</span>'+(c[0]?'':'<button class="btn btn-ghost btn-sm" data-act="atab" data-v="'+c[2]+'">أكمل</button>')+'</li>'}).join('')+'</ul></section>';
}
function arow(p){

function renderOverlay(){
  if(!lb){ov.innerHTML='';ov.hidden=true;return}
  var p=data().projects.find(function(x){return x.id===lb.id});
  if(!p||!p.shots[lb.i]){lb=null;ov.hidden=true;ov.innerHTML='';return}
  ov.hidden=false;
  ov.innerHTML='<div class="lb" role="dialog" aria-modal="true" aria-label="معرض اللقطات"><button class="btn-ic lb-x" data-ov="close" aria-label="إغلاق">'+icon('close')+'</button><img src="'+p.shots[lb.i]+'" alt=""><div class="lb-nav"><button class="btn-ic" data-ov="prev" aria-label="السابقة">'+icon('arrowR')+'</button><span class="mono">'+(lb.i+1)+' / '+p.shots.length+'</span><button class="btn-ic" data-ov="next" aria-label="التالية">'+icon('arrowL')+'</button></div></div>';
}
ov.addEventListener('click',function(e){
  var b=e.target.closest('[data-ov]');
  if(!b){if(e.target.classList.contains('lb'))lb=null;renderOverlay();return}
  var p=data().projects.find(function(x){return x.id===lb.id}),n=p.shots.length,a=b.dataset.ov;
  if(a==='close')lb=null;
  else if(a==='prev')lb.i=(lb.i-1+n)%n;
  else if(a==='next')lb.i=(lb.i+1)%n;
  renderOverlay();
});
D.addEventListener('keydown',function(e){
  if(!lb)return;
  var p=data().projects.find(function(x){return x.id===lb.id});if(!p)return;
  var n=p.shots.length;
  if(e.key==='Escape')lb=null;
  else if(e.key==='ArrowLeft')lb.i=(lb.i+1)%n;
  else if(e.key==='ArrowRight')lb.i=(lb.i-1+n)%n;
  else return;
  renderOverlay();
});

/* ---------- images ---------- */
function readImage(file,maxW,q){
  return new Promise(function(res,rej){
    var fr=new FileReader();
    fr.onerror=function(){rej(new Error('read'))};
    fr.onload=function(){
      var im=new Image();
      im.onerror=function(){rej(new Error('img'))};
      im.onload=function(){
        var s=Math.min(1,maxW/im.width),w=Math.max(1,Math.round(im.width*s)),h=Math.max(1,Math.round(im.height*s));
        var c=D.createElement('canvas');c.width=w;c.height=h;
        var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);
        res(c.toDataURL('image/jpeg',q));
      };
      im.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}

function saveProfile(){
  var f=pform;
  var skills=String(f.skillsText||'').split('\n').map(function(l){return l.trim()}).filter(Boolean).map(function(l){
    var m=l.split(/[:：]/),g=m.shift().trim(),rest=m.join(':');
    return rest?{group:g,items:splitList(rest)}:{group:'أخرى',items:splitList(g)};
  });
  var links=f.links.filter(function(l){return String(l.url||'').trim()}).map(function(l){return{label:String(l.label||'').trim()||'رابط',url:String(l.url).trim()}});
  var bad=links.find(function(l){return!/^https:\/\//i.test(l.url)});
  if(bad){toast('روابط التواصل تبدأ بـ https://','bad');return}
  mutate(function(){draft.profile=Object.assign({},draft.profile,{name:String(f.name).trim(),role:String(f.role).trim(),tagline:String(f.tagline).trim(),bio:String(f.bio).trim(),email:String(f.email).trim(),location:String(f.location).trim(),available:!!f.available,links:links,skills:skills})});
  pform=null;renderAdminMain();refreshBar();
  toast('حُفظ الملف الشخصي في المسودة.','ok');
}
function buildDoc(s){
  var css=$('#css').textContent,js=$('#main').textContent,reset=FALLBACK_RESET;
  var hs=D.head.querySelector('style');
  if(hs&&hs.textContent.indexOf('safe-area')>-1)reset=hs.textContent;
  var json=JSON.stringify(s).replace(/</g,'\\u003c');
  var title='أعمال '+(s.profile.name||'المعرض');
  var S='<scr'+'ipt',E='</scr'+'ipt>';
  return '<!doctype html><html><head><meta charset="utf8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+reset+'</style></head><body>'+
    '<title>'+esc(title)+'</title><meta name="claude:viewport-fit-sides" content="cover">'+FONT_LINK+'<style id="css">'+css+'</style><div id="app" dir="rtl" lang="ar"></div>'+
    S+' type="application/json" id="data">'+json+E+S+' id="main">'+js+E+'</body></html>';
}
async function publishNow(){
  if(busy)return;
  if(!art){toast('النشر غير متاح في هذا العرض.','bad');return}
  ensureDraft();
  var next=clone(draft);next.updated=new Date().toISOString();
  var doc;
  try{doc=buildDoc(next)}catch(e){toast('تعذّر تجهيز الصفحة للنشر.','bad');return}
  if(doc.length>15800000){toast('حجم الصفحة كبير جدًا. احذف بعض الصور ثم أعد المحاولة.','bad');return}
  busy=true;refreshBar();
  try{
    await art.publish(doc);
    clearDraft();dirty=false;
    toast('تم النشر. جاري تحديث الصفحة...','ok');
  }catch(e){
    busy=false;
    var c=e&&e.code,M={
      conflict:'نُشرت نسخة أحدث من مكان آخر وستُحمَّل الآن. أعد إدخال تعديلاتك إن لزم.',
      not_writer:'ما عندك صلاحية تعديل هذه الصفحة.',not_granted:'ما عندك صلاحية تعديل هذه الصفحة.',
      too_large:'حجم الصفحة أكبر من الحد المسموح. قلّل الصور.',rate_limited:'نشر متكرر. انتظر قليلًا ثم حاول مجددًا.'};
    toast(M[c]||'تعذّر النشر. حاول مرة أخرى.','bad');
    refreshBar();
  }
}
async function exportJson(){
  try{
    var dl=(W.claude&&W.claude.use)?await W.claude.use('downloads'):null;
    if(!dl){toast('التصدير غير متاح في هذا العرض.','bad');return}
    ensureDraft();
    await dl.save({filename:'portfolio-backup.json',data:JSON.stringify(draft)});
    toast('تم تجهيز النسخة الاحتياطية.','ok');
  }catch(e){if(e&&e.code==='declined')return;toast('تعذّر التصدير.','bad')}
}

var ACT={
  tag:function(el){filters[el.dataset.t].tag=el.dataset.v;render()},
  lb:function(el){var id=token.slice(2);lb={id:id,i:parseInt(el.dataset.i,10)||0};renderOverlay()},
  copy:function(el){
    var v=el.dataset.v;
    try{navigator.clipboard.writeText(v).then(function(){toast('تم النسخ.','ok')},function(){toast('انسخ النص يدويًا.','bad')})}catch(e){toast('انسخ النص يدويًا.','bad')}
  },
  atab:function(el){adminTab=el.dataset.v;editing=null;edErr={};pform=null;render()},
  newp:function(){editing=blank('game');edErr={};renderAdminMain();W.scrollTo(0,0)},
  editp:function(el){
    var p=draft.projects.find(function(x){return x.id===el.dataset.id});if(!p)return;
    editing=Object.assign(clone(p),{stackText:p.stack.join('، '),featuresText:p.features.join('\n'),year:String(p.year||''),isNew:false});
    if(!editing.links.length)editing.links=[{label:'',url:''}];
    edErr={};renderAdminMain();W.scrollTo(0,0);
  },
  delp:function(el){
    var id=el.dataset.id;
    if(confirmDel===id){mutate(function(){draft.projects=draft.projects.filter(function(p){return p.id!==id})});confirmDel=null;renderAdminMain(true);toast('حُذف المشروع من المسودة.','ok');return}
    confirmDel=id;renderAdminMain(true);
    setTimeout(function(){if(confirmDel===id){confirmDel=null;var l=$('#plist');if(l)l.innerHTML=plistHtml()}},4000);
  },
  togv:function(el){mutate(function(){var p=draft.projects.find(function(x){return x.id===el.dataset.id});if(p)p.visible=p.visible===false}); $('#plist').innerHTML=plistHtml();refreshBar()},
  togf:function(el){mutate(function(){var p=draft.projects.find(function(x){return x.id===el.dataset.id});if(p)p.featured=!p.featured}); $('#plist').innerHTML=plistHtml();refreshBar()},
  rmdemo:function(){
    if(!confirmDemo){confirmDemo=true;renderAdminMain(true);setTimeout(function(){if(confirmDemo){confirmDemo=false;if(adminTab==='projects'&&!editing)renderAdminMain(true)}},4000);return}
    confirmDemo=false;mutate(function(){draft.projects=draft.projects.filter(function(p){return!p.demo})});renderAdminMain(true);toast('حُذفت المشاريع التجريبية من المسودة.','ok');
  },
  edsave:saveEditor,
  edcancel:function(){editing=null;edErr={};renderAdminMain();W.scrollTo(0,0)},
  addlink:function(){editing.links.push({label:'',url:''});renderAdminMain(true)},
  rmlink:function(el){editing.links.splice(parseInt(el.dataset.i,10),1);if(!editing.links.length)editing.links.push({label:'',url:''});renderAdminMain(true)},
  rmcover:function(){editing.cover='';renderAdminMain(true)},
  rmshot:function(el){editing.shots.splice(parseInt(el.dataset.i,10),1);renderAdminMain(true)},
  addplink:function(){pform.links.push({label:'',url:''});renderAdminMain(true)},
  rmplink:function(el){pform.links.splice(parseInt(el.dataset.i,10),1);renderAdminMain(true)},
  saveprofile:saveProfile,
  publish:publishNow,
  discard:function(){
    draft=clone(published);dirty=false;clearDraft();editing=null;pform=null;confirmDel=null;
    render();toast('أُعيدت المسودة إلى النسخة المنشورة.','ok');
  },
  preview:function(){ensureDraft();preview=true;go('home')},
  exitpreview:function(){preview=false;go('admin')},
  export:exportJson
};
app.addEventListener('click',function(e){
  var nav=e.target.closest('[data-nav]');
  if(nav){if(e.metaKey||e.ctrlKey)return;e.preventDefault();go(nav.dataset.nav);return}
  var el=e.target.closest('[data-act]');
  if(!el||el.disabled)return;
  var fn=ACT[el.dataset.act];
  if(fn){e.preventDefault();fn(el,e)}
});
app.addEventListener('submit',function(e){e.preventDefault()});
app.addEventListener('input',function(e){
  var el=e.target,ds=el.dataset;
  if(ds.lq){filters[ds.lq].q=el.value;updateGrid(ds.lq);return}
  if(ds.aq){adminF.q=el.value;$('#plist').innerHTML=plistHtml();return}
  if(ds.f&&editing){editing[ds.f]=el.type==='checkbox'?el.checked:el.value;return}
  if(ds.lk!==undefined&&editing){editing.links[parseInt(ds.lk,10)][ds.lkf]=el.value;return}
  if(ds.pf&&pform){pform[ds.pf]=el.type==='checkbox'?el.checked:el.value;return}
  if(ds.plk!==undefined&&pform){pform.links[parseInt(ds.plk,10)][ds.plf]=el.value;return}
});
app.addEventListener('change',function(e){
  var el=e.target,ds=el.dataset;
  if(ds.ls){filters[ds.ls].sort=el.value;updateGrid(ds.ls);return}
  if(ds.at){adminF.type=el.value;$('#plist').innerHTML=plistHtml();return}
  if(ds.as){adminF.status=el.value;$('#plist').innerHTML=plistHtml();return}
  if(ds.f&&editing){
    editing[ds.f]=el.type==='checkbox'?el.checked:el.value;
    if(ds.f==='type')renderAdminMain(true);
    return;
  }
  if(ds.pf&&pform){pform[ds.pf]=el.type==='checkbox'?el.checked:el.value;return}
  if(ds.file){
    var files=Array.prototype.slice.call(el.files||[]);el.value='';
    if(!files.length)return;
    if(ds.file==='import'){
      var fr=new FileReader();
      fr.onload=function(){
        try{
          var o=JSON.parse(fr.result);
          if(!o||!Array.isArray(o.projects))throw new Error('shape');
          draft=normalize(o);dirty=true;saveDraft();pform=null;editing=null;
          renderAdminMain();toast('تم استيراد النسخة إلى المسودة. اضغط «نشر التغييرات» لاعتمادها.','ok');
        }catch(err){toast('الملف غير صالح. اختر ملف نسخة احتياطية من هذا المعرض.','bad')}
      };
      fr.readAsText(files[0]);
      return;
    }
    if(!editing)return;
    (async function(){
      try{
        if(ds.file==='cover'){editing.cover=await readImage(files[0],960,0.8)}
        else{
          var room=4-editing.shots.length;
          for(var i=0;i<files.length&&i<room;i++)editing.shots.push(await readImage(files[i],1100,0.74));
        }
        renderAdminMain(true);
      }catch(err){toast('تعذّر قراءة الصورة. جرّب ملفًا آخر.','bad')}
    })();
  }
});

/* ---------- capabilities ---------- */
(async function(){
  try{art=(W.claude&&W.claude.use)?await W.claude.use('artifact'):null}catch(e){art=null}
  var ok=false;
  try{var u=(W.claude&&W.claude.use)?await W.claude.use('user'):null;ok=!!(u&&await u.canEdit())}catch(e){}
  canAdmin=!!art&&ok;capsReady=true;
  if(token==='admin')render();
})();

render();
})();
